<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 ¿Quieres ser mi Mapachita? 💖</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Fondo Universo -->
    <div class="estrellas"></div>
    <div class="estrellas2"></div>
    <div class="estrellas3"></div>

    <main class="contenedor">

        <!-- GIF MAPACHITO ENAMORADO -->
        <img src="img/mapachita.gif" alt="Mapachito Enamorado" class="gif">

        <h1>💖 ¿Quieres ser mi Mapachita? 💖</h1>

        <p class="texto">
            Desde que llegaste, cada día tiene un brillo diferente. ✨🦝❤️
        </p>

        <div class="botones">
            <button id="btnSi" onclick="aceptar()">💖 Sí</button>
            <button id="btnNo" onclick="moverNo()">🤭 No</button>
        </div>

        <div id="sorpresa" class="oculto">
            <h2>🥹 ¡Sabía que dirías que sí! 💖</h2>

            <p>
                Gracias por aceptar ser mi Mapachita. ❤️
                Tengo una sorpresa para ti.
            </p>

            <button class="youtube"
            onclick="window.open('https://youtu.be/TU_LINK_AQUI','_blank')">
                🎵 Ver Sorpresa
            </button>
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
