<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 Mi Mapachita 💖</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Fondo de estrellas -->
    <div class="estrellas"></div>
    <div class="estrellas2"></div>
    <div class="estrellas3"></div>

    <!-- Contenido principal -->
    <main class="contenedor">

        <img src="https://media.tenor.com/LxggFGxwOjIAAAAC/cat-love.gif"
             alt="Gatito enamorado"
             class="gif">

        <h1>¿Quieres ser mi Mapachita? 💖</h1>

        <p class="texto">
            Desde que llegaste, haces mis días mucho más bonitos. ✨❤️
        </p>

        <div class="botones">
            <button id="btnSi" onclick="aceptar()">💖 Sí</button>
            <button id="btnNo" onclick="moverNo()">🤭 No</button>
        </div>

        <!-- Se muestra al aceptar -->
        <div id="sorpresa" class="oculto">

            <h2>🥹 Sabía que dirías que sí 💖</h2>

            <p>
                Ahora toca ver la sorpresa que preparé para ti. ✨
            </p>

            <button class="youtube"
                onclick="window.open('https://youtu.be/TU_LINK_AQUI','_blank')">
                🎵 Ver Sorpresa
            </button>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
